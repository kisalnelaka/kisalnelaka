name: Update Profile

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate_banner.py
          python .github/scripts/generate_showcase_card.py
          python .github/scripts/generate_tech_dashboard.py

      - name: Update recent repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_recent_repos.py

      - name: Refresh chess board
        run: |
          pip install chess
          python .github/scripts/chess_game.py

      - name: Commit SVGs and README
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.svg showcase-card.svg tech-dashboard.svg README.md
          git diff --cached --quiet || git commit -m "chore: auto-update profile [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push

      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@kisalnelaka6"
          max_post_count: 5
          readme_path: README.md
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
