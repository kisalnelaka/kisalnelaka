name: Update Profile

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ── Dynamic SVG generation ──────────────────────────────────────────────
      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate_banner.py
          python .github/scripts/generate_showcase_card.py
          python .github/scripts/generate_tech_dashboard.py
          python .github/scripts/generate_writing_card.py

      # ── README section updates ──────────────────────────────────────────────
      - name: Update recent repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_recent_repos.py

      - name: Update blog post list in README
        run: python .github/scripts/update_blog_posts.py

      # ── Commit everything ───────────────────────────────────────────────────
      - name: Commit and push
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner.svg showcase-card.svg tech-dashboard.svg writing-card.svg README.md
          git diff --cached --quiet || git commit -m "chore: auto-update profile [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
