name: Update Profile Dynamic Sections

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Dynamic Update Scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_recent_repos.py
          python .github/scripts/update_blog_posts.py
          python .github/scripts/update_showcase.py
          python .github/scripts/generate_showcase_card.py
          python .github/scripts/generate_tech_dashboard.py
          python .github/scripts/generate_banner.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tech-dashboard.svg banner.svg showcase-card.svg
          git commit -m "chore: auto-update profile [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" || exit 0
          git push
