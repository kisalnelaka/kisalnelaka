<svg width="860" height="340" viewBox="0 0 860 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blueprint Background -->
    <radialGradient id="blueprint-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#020814"/>
      <stop offset="100%" stop-color="#010308"/>
    </radialGradient>
    
    <!-- Neon Glows -->
    <filter id="neon-cyan">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="neon-violet">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>

    <!-- Data Packet Animation Path -->
    <linearGradient id="packet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="transparent" />
        <stop offset="50%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="860" height="340" fill="url(#blueprint-bg)"/>
  
  <!-- Blueprint Grid -->
  <pattern id="blueprint-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05"/>
  </pattern>
  <rect width="860" height="340" fill="url(#blueprint-grid)"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="860" height="40" fill="#00f0ff" fill-opacity="0.05" />
  <line x1="0" y1="40" x2="860" y2="40" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1" />
  <text x="20" y="25" font-family="monospace" font-size="14" font-weight="bold" fill="#00f0ff" letter-spacing="2">ARCHITECTURAL BLUEPRINTS // ACTIVE SYSTEMS</text>
  
  <!-- ==================== NEXUSFLOW ERP (LEFT) ==================== -->
  <g transform="translate(30, 70)">
    <!-- Main Node Box -->
    <rect x="0" y="0" width="380" height="240" fill="#050a15" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1" />
    <!-- Cyber Corners -->
    <path d="M 0 10 L 0 0 L 10 0" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <path d="M 370 0 L 380 0 L 380 10" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <path d="M 0 230 L 0 240 L 10 240" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <path d="M 370 240 L 380 240 L 380 230" fill="none" stroke="#00f0ff" stroke-width="2"/>

    <text x="20" y="30" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" filter="url(#neon-cyan)">NEXUSFLOW ERP</text>
    <text x="20" y="50" font-family="monospace" font-size="10" fill="#00f0ff">MULTI-TENANT SAAS INFRASTRUCTURE</text>
    
    <!-- Schematic Diagram -->
    <g transform="translate(20, 80)">
        <!-- Core Router -->
        <rect x="120" y="40" width="100" height="40" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1.5" />
        <text x="170" y="65" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00f0ff">ISO_ROUTER</text>
        
        <!-- Tenants -->
        <rect x="0" y="0" width="80" height="30" fill="#ff2d20" fill-opacity="0.1" stroke="#ff2d20" stroke-width="1" />
        <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff2d20">TENANT_A</text>

        <rect x="0" y="80" width="80" height="30" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1" />
        <text x="40" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#a855f7">TENANT_B</text>
        
        <!-- Animated Connections -->
        <path id="pathA" d="M 80 15 L 120 45" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="2"/>
        <path id="pathB" d="M 80 95 L 120 75" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="2"/>
        
        <!-- Flowing Packets -->
        <circle r="3" fill="#00f0ff" filter="url(#neon-cyan)">
           <animateMotion dur="2s" repeatCount="indefinite" path="M 80 15 L 120 45" />
        </circle>
        <circle r="3" fill="#00f0ff" filter="url(#neon-cyan)">
           <animateMotion dur="2.5s" repeatCount="indefinite" path="M 80 95 L 120 75" />
        </circle>
        
        <!-- Database -->
        <rect x="260" y="30" width="60" height="60" rx="30" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1" />
        <text x="290" y="65" text-anchor="middle" font-family="monospace" font-size="10" fill="#f59e0b">SECURE DB</text>
        
        <path d="M 220 60 L 260 60" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="2"/>
        <circle r="3" fill="#f59e0b">
           <animateMotion dur="1s" repeatCount="indefinite" path="M 220 60 L 260 60" />
        </circle>
    </g>
    
    <!-- Specs text -->
    <text x="20" y="215" font-family="monospace" font-size="10" fill="#888888">100% Data Isolation // Low-Latency Inter-Service Comm.</text>
  </g>

  <!-- ==================== THENET (RIGHT) ==================== -->
  <g transform="translate(450, 70)">
    <!-- Main Node Box -->
    <rect x="0" y="0" width="380" height="240" fill="#0a0515" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    <!-- Cyber Corners -->
    <path d="M 0 10 L 0 0 L 10 0" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M 370 0 L 380 0 L 380 10" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M 0 230 L 0 240 L 10 240" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M 370 240 L 380 240 L 380 230" fill="none" stroke="#a855f7" stroke-width="2"/>

    <text x="20" y="30" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" filter="url(#neon-violet)">THENET_MESH</text>
    <text x="20" y="50" font-family="monospace" font-size="10" fill="#a855f7">DECENTRALIZED PEER-TO-PEER NETWORK</text>
    
    <!-- Schematic Diagram -->
    <g transform="translate(40, 80)">
        <!-- Mesh Nodes -->
        <circle cx="40" cy="60" r="25" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1" />
        <text x="40" y="64" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8">NODE_1</text>

        <circle cx="150" cy="20" r="25" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1" />
        <text x="150" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#a855f7">NODE_2</text>
        
        <circle cx="150" cy="100" r="25" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1" />
        <text x="150" y="104" text-anchor="middle" font-family="monospace" font-size="10" fill="#a855f7">NODE_3</text>
        
        <circle cx="260" cy="60" r="25" fill="#00ff9f" fill-opacity="0.1" stroke="#00ff9f" stroke-width="1" />
        <text x="260" y="64" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff9f">NODE_4</text>
        
        <!-- Connections -->
        <!-- 1 to 2 -->
        <path d="M 58 42 L 132 38" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4"/>
        <circle r="2" fill="#38bdf8"><animateMotion dur="1.2s" repeatCount="indefinite" path="M 58 42 L 132 38" /></circle>
        <!-- 1 to 3 -->
        <path d="M 58 78 L 132 82" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4"/>
        <circle r="2" fill="#38bdf8"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 58 78 L 132 82" /></circle>
        <!-- 2 to 4 -->
        <path d="M 168 38 L 242 42" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4"/>
        <circle r="2" fill="#a855f7"><animateMotion dur="1.3s" repeatCount="indefinite" path="M 168 38 L 242 42" /></circle>
        <!-- 3 to 4 -->
        <path d="M 168 82 L 242 78" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4"/>
        <circle r="2" fill="#a855f7"><animateMotion dur="1.1s" repeatCount="indefinite" path="M 168 82 L 242 78" /></circle>
        <!-- 2 to 3 -->
        <path d="M 150 45 L 150 75" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 4"/>
        <circle r="2" fill="#00ff9f"><animateMotion dur="0.8s" repeatCount="indefinite" path="M 150 75 L 150 45" /></circle>
    </g>

    <!-- Specs text -->
    <text x="20" y="215" font-family="monospace" font-size="10" fill="#888888">Zero Cloud Dependency // Real-Time WebSocket Sync</text>
  </g>

</svg>